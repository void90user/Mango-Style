# Keyboard

repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us
# xkb_rules_rules=evdev
# xkb_rules_model=pc105
# xkb_rules_variant=dvorak
# xkb_rules_options=caps:escape

# Mouse

mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=0.0
mouse_left_handed=0
mouse_middle_button_emulation=0
mouse_scroll_method=1
mouse_scroll_button=274
mouse_click_method=1
mouse_send_events_mode=0
axis_scroll_factor=1.0

# Trackpad

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_accel_profile=2
trackpad_accel_speed=0.0
trackpad_left_handed=0
trackpad_middle_button_emulation=0
trackpad_disable_while_typing=1
trackpad_scroll_method=1
trackpad_scroll_button=274
trackpad_click_method=1
trackpad_send_events_mode=0
trackpad_scroll_factor=1.0
button_map=0

# Gestures

swipe_min_threshold=1
gesture_live=1
gesture_swipe_distance=300
gesture_swipe_cancel_ratio=0.5
gesture_swipe_min_speed_to_force=10

# Touchscreen

touch_enable=1
touch_enable_mouse_emulation=0

# Device Rules

# device_rule=type:trackpad,tap_to_click:1,tap_and_drag:1,natural_scrolling:0,accel_profile:2,accel_speed:0.0,disable_while_typing:1
# device_rule=type:pointer,natural_scrolling:0,accel_profile:2,accel_speed:0.0,left_handed:0
# device_rule=name:,monitor:HDMI-A-1,map_focus_monitor:0

# Monitors

monitor_rule=name:^DP-1$,width:2560,height:1440,refresh:160,x:0,y:0,vrr:0,hdr:1,primary:1,scale:1
monitor_rule=name:^HDMI-A-5$,width:1920,height:1080,refresh:60,x:2560,y:0,rr:3,vrr:0

# Tearing and HDR

allow_tearing=1
hdr_depth=2
