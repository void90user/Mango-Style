# System

xwayland_persistence=1
xwayland_ignore_scale=0
sync_obj_enable=1
allow_lock_transparent=0
allow_shortcuts_inhibit=1
auto_reload_config=1
disable_middle_paste=0

# Focus

focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
focus_direction_only_zone_overlap=1

# Cursor Behavior

cursor_hide_timeout=0
cursor_hide_on_keypress=0

# Window Dragging

drag_tile_to_tile=1
drag_tile_small=1
drag_corner=3
drag_warp_cursor=1
enable_border_resize=1
border_resize_size=10

# Floating Windows

enable_floating_snap=1
snap_distance=35
float_full_to_top=0

# Window Borders

no_border_when_single=0

# Idle Inhibit

idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0

# Multi-Monitor

exchange_cross_monitor=0
scratchpad_cross_monitor=1
single_scratchpad=1

# Axis Bindings

axis_bind_apply_timeout=100
